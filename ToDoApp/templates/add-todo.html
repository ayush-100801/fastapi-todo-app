{% include "layout.html" %}
<div class="container">
    <div class="card">
        <div class="card-header"> Make a new todo</div>
        <div class="card-body">
            <form id="todoForm">
                <div class="form-group"><label>Title</label> <input class="form-control" type="text" name="title"
                                                                    required></div>
                <div class="form-group"><label>Description</label> <textarea class="form-control" name="description"
                                                                             required rows="3"></textarea></div>
                <div class="form-group"><label>Priority</label> <select class="form-control" name="priority" required>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select></div>
                <button type="submit" class="btn btn-primary">Add new todo</button>
                <a class="btn btn-success" href="/todos/todo-page">Back</a></form>
        </div>
    </div>
</div>
